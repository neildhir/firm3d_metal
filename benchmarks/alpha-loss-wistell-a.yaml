# Benchmark "alpha-loss-wistell-a": CPU-vs-Metal tracing of fusion-birth alphas.
# Both tracers integrate the same ensembles in the same field at the same
# tolerance; the CPU runs one MPI rank per physical core, the GPU one process.
# Results from every machine live in results/alpha-loss-wistell-a/ and are only
# comparable while this file is unchanged: to change the workload, copy it to
# a new benchmark name instead of editing it.

description: fusion-birth alphas, Wistell-A vacuum field (ARIES-CS scale) # plot subtitle

boozmn_file: ../examples/inputs/boozmn_aten_rescaled.nc # relative to this directory; run from here

interpolation:
  resolution: 48 # interpolation cells per dimension (ns = ntheta = nzeta), dimensionless
  degree: 3 # degree of the 3D interpolant, dimensionless

tracing:
  tmax_s: 1.0e-3 # physical tracing time per marker [s]
  tol: 1.0e-6 # ODE solver tolerance (abstol = reltol), dimensionless

scaling_nparticles: [100, 500, 1000, 5000, 10000] # ensemble sizes for the scaling curve

validation:
  nparticles: 5000 # ensemble for the loss-fraction comparison, dimensionless
  tmax_s: 1.0e-2 # physical tracing time [s]
  tmin_s: 1.0e-5 # start of the loss-fraction curve [s]

seed: 42 # RNG seed for position and velocity sampling
