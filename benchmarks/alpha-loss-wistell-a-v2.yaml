# Benchmark "alpha-loss-wistell-a-v2": CPU-vs-Metal tracing of fusion-birth alphas.
# The workload of alpha-loss-wistell-a, with the traced particle pinned below.
# That benchmark took the alpha's mass from firm3d, which upstream changed on
# 2026-10-31 (two proton plus two neutron masses -> the measured alpha mass,
# 0.76% lighter), so its runs before and after the change trace different
# orbits under one fingerprint. Both tracers integrate the same ensembles in
# the same field at the same tolerance; the CPU runs one MPI rank per physical
# core, the GPU one process. Results from every machine live in
# results/alpha-loss-wistell-a-v2/ and are only comparable while this file is
# unchanged: to change the workload, copy it to a new benchmark name instead
# of editing it.

kind: loss # selects the leg scripts, sanity check, and plots
supersedes: alpha-loss-wistell-a # make_plots then skips that benchmark unless it is named

description: fusion-birth alphas, Wistell-A vacuum field (ARIES-CS scale) # plot subtitle

boozmn_file: ../examples/inputs/boozmn_aten_rescaled.nc # relative to this directory; run from here

particle: # the traced species, pinned here rather than taken from firm3d.util.constants
  mass_kg: 6.644657345e-27 # alpha particle mass, firm3d's value since 2026-10-31 [kg]
  charge_C: 3.204353268e-19 # 2 e [C]
  energy_J: 5.639661751679999e-13 # 3.52 MeV fusion birth energy [J]

interpolation:
  resolution: 48 # interpolation cells per dimension (ns = ntheta = nzeta), dimensionless
  degree: 3 # degree of the 3D interpolant, dimensionless

tracing:
  tmax_s: 1.0e-3 # physical tracing time per marker [s]
  tol: 1.0e-6 # ODE solver tolerance (abstol = reltol), dimensionless

scaling_nparticles: [100, 500, 1000, 5000, 10000] # ensemble sizes for the scaling curve

validation:
  nparticles: 5000 # ensemble for the loss-fraction comparison, dimensionless
  tmax_s: 1.0e-2 # physical tracing time [s]
  tmin_s: 1.0e-5 # start of the loss-fraction curve [s]

seed: 42 # RNG seed for position and velocity sampling
